[project]
name = "finagent"
version = "0.1.0"
description = "Reference platform for building, evaluating, and observing LLM agents in financial workflows"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "anthropic>=0.34",
    "yfinance>=0.2",
    "requests>=2.31",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finagent = "finagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finagent"]
