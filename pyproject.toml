[project]
name = "finagent"
version = "0.1.0"
description = "Reference platform for building, evaluating, and observing LLM agents in financial workflows"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "anthropic>=0.34",
    "yfinance>=0.2",
    "requests>=2.31",
    "click>=8.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langfuse>=2.50",
    "langchain>=0.3",
    "wandb>=0.17",
    "ray>=2.9,<2.35",
    "mcp>=1.0,<2.0",
    "cryptography<45",
    "prometheus-client>=0.20",
    "sentry-sdk>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
training = ["torch>=2.0,<2.3", "transformers>=4.30,<4.50"]
bedrock = ["langchain-aws>=0.2"]
rag = ["chromadb>=0.5,<0.6", "sentence-transformers>=3.0,<3.1", "beautifulsoup4>=4.12", "lxml>=5.0", "onnxruntime<1.24", "numpy<2"]

[project.scripts]
finagent = "finagent.cli:main"
finagent-mcp = "finagent.mcp_server.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finagent"]
